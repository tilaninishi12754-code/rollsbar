<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rolls Bar — дизайн v2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f5}
    #stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f4f5}
  </style>
</head>
<body>
  <iframe id="stage" src="client-fixes.html?v=design-v2-base" title="Rolls Bar"></iframe>
  <script>
  (function(){
    var stage=document.getElementById('stage');
    function getDeepDocument(){
      try{
        var wrapper=stage.contentDocument;
        var inner=wrapper&&wrapper.getElementById('site');
        return inner&&inner.contentDocument?inner.contentDocument:null;
      }catch(e){return null;}
    }
    function applyDesign(){
      var d=getDeepDocument();
      if(!d||!d.body) return false;
      if(d.body.dataset.dodoDesignV2==='1') return true;
      d.body.dataset.dodoDesignV2='1';

      var css=d.createElement('style');
      css.textContent=`
        :root{--shell:min(1180px,calc(100% - 40px));--soft:#f3f4f5;--line:#ececec;--shadow:0 12px 34px rgba(18,22,26,.07)}
        html{background:#f3f4f5}
        body{background:#f3f4f5!important}
        .topbar{background:rgba(255,255,255,.98)!important;backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.045)!important}
        .topbar__inner{min-height:78px!important;gap:14px!important}
        .brand__ninja{width:44px!important;height:56px!important;background:transparent!important;box-shadow:none!important;border-radius:0!important}
        .brand__logo-img{width:160px!important;height:52px!important}
        .header-phone-number{font-size:13px!important;font-weight:900!important}
        .cart-button{border-radius:18px!important;padding:12px 18px!important;box-shadow:none!important}
        .menu-toggle{border-radius:14px!important;box-shadow:none!important}
        .category-nav{top:78px!important;background:rgba(255,255,255,.985)!important;box-shadow:0 7px 18px rgba(18,22,26,.035);border-bottom:0!important}
        .category-nav__scroll{min-height:58px!important;gap:6px!important;padding:9px 0!important}
        .category-nav a{font-size:13px!important;padding:9px 13px!important;border-radius:999px!important;color:#313236!important}
        .category-nav a.active,.category-nav a:hover{background:#d92525!important;color:#fff!important}
        .quick-menu{display:none!important}

        .client-promo-wrap{background:#f3f4f5;padding:24px 0 26px}
        .client-promo{width:var(--shell);margin:0 auto;min-height:208px;border-radius:30px;overflow:hidden;position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:stretch;background:linear-gradient(118deg,#d71f29 0%,#e63a32 48%,#fa6654 100%);box-shadow:0 18px 50px rgba(173,22,31,.18);color:#fff;cursor:pointer}
        .client-promo:before{content:'';position:absolute;inset:auto auto -90px -70px;width:270px;height:270px;border-radius:48%;background:rgba(255,255,255,.08);transform:rotate(18deg)}
        .client-promo__copy{position:relative;z-index:2;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
        .client-promo__eyebrow{display:inline-flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
        .client-promo h1{margin:12px 0 7px;font-size:52px;line-height:.92;letter-spacing:-.055em;color:#fff}
        .client-promo p{margin:0;max-width:520px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.88)}
        .client-promo__cta{display:inline-flex;align-items:center;gap:9px;margin-top:19px;padding:11px 15px;border-radius:14px;background:#fff;color:#bd1e25;font-size:13px;font-weight:900}
        .client-promo__art{position:relative;z-index:1;margin:16px 18px 16px 0;border-radius:24px;background:#fff;overflow:hidden;box-shadow:0 18px 40px rgba(106,16,22,.18)}
        .client-promo__food{position:absolute;inset:0;background-image:url('assets/vk-products-row2.webp');background-repeat:no-repeat;background-size:600% 100%;background-position:60% 50%}
        .client-promo__art:after{content:'ROLLS BAR';position:absolute;right:14px;bottom:12px;padding:7px 9px;border-radius:10px;background:rgba(20,20,20,.78);color:#fff;font-size:9px;font-weight:900;letter-spacing:.08em}

        main{background:#fff!important;border-radius:34px 34px 0 0;margin-top:0;padding-top:30px;min-height:70vh;box-shadow:0 -1px 0 rgba(0,0,0,.035)}
        main>.section:first-of-type{padding-top:0!important}
        .section{padding-top:62px!important}
        .section-heading{margin-bottom:22px!important}
        .section-heading h2{font-size:34px!important;letter-spacing:-.045em!important}
        .product-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:28px 20px!important}
        .product-card{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;overflow:visible!important}
        .product-card__visual{border-radius:23px!important;background:#f4f5f6!important;box-shadow:none!important}
        .product-card__body{padding:13px 2px 0!important}
        .product-card h3{font-size:17px!important;line-height:1.16!important;margin:0 0 6px!important;letter-spacing:-.025em!important}
        .product-card p{font-size:12px!important;line-height:1.38!important;min-height:34px!important;margin-bottom:10px!important;color:#7b7d80!important}
        .price strong{font-size:18px!important}
        .product-card__footer{gap:8px!important}
        .product-badges{top:11px!important;left:11px!important}
        .badge{box-shadow:none!important;border:1px solid rgba(0,0,0,.045)!important}
        .client-action-wrap{min-height:38px!important}
        .client-plus{width:38px!important;height:38px!important;border-radius:50%!important;box-shadow:none!important;font-size:22px!important}
        .client-choose{border-radius:999px!important;padding:10px 15px!important;background:#fff1f0!important}
        .client-counter{border-radius:999px!important}
        .product-card.client-accent{padding:10px!important;border-radius:24px!important}
        .product-card.client-accent-blue{background:#edf3ff!important}
        .product-card.client-accent-red{background:#fff0ef!important}
        .product-card.client-accent-warm{background:#fff7e8!important}
        .product-card.client-accent .product-card__body{padding-left:4px!important;padding-right:4px!important}
        .delivery-card,.conditions-card,.simple-card{box-shadow:none!important;border-color:#ececec!important}
        .footer{margin-top:72px!important}

        @media(max-width:1050px){
          :root{--shell:min(100% - 32px,940px)}
          .client-promo{grid-template-columns:1fr 280px;min-height:190px}
          .client-promo h1{font-size:46px}
          .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
        }
        @media(max-width:700px){
          :root{--shell:calc(100% - 28px)}
          html{scroll-padding-top:116px!important}
          .topbar__inner{min-height:66px!important;padding:5px 0!important}
          .brand__ninja{width:30px!important;height:40px!important}
          .brand__logo-img{width:101px!important;height:34px!important}
          .header-phone-number{font-size:11px!important}
          .menu-toggle{width:35px!important;height:35px!important}
          .category-nav{top:66px!important}
          .category-nav__scroll{min-height:50px!important;padding:7px 0!important}
          .category-nav a{font-size:12px!important;padding:8px 11px!important}
          .client-promo-wrap{padding:11px 0 14px}
          .client-promo{min-height:126px;grid-template-columns:minmax(0,1fr) 116px;border-radius:20px;box-shadow:none}
          .client-promo__copy{padding:17px 16px}
          .client-promo__eyebrow{font-size:8px;padding:5px 7px}
          .client-promo h1{font-size:30px;margin:8px 0 4px}
          .client-promo p{font-size:10.5px;line-height:1.3;max-width:205px}
          .client-promo__cta{margin-top:9px;padding:7px 9px;border-radius:10px;font-size:9px}
          .client-promo__art{margin:9px 9px 9px 0;border-radius:15px;box-shadow:none}
          .client-promo__art:after{display:none}
          main{border-radius:24px 24px 0 0;padding-top:23px!important}
          .section{padding-top:44px!important}
          main>.section:first-of-type{padding-top:0!important}
          .section-heading{margin-bottom:15px!important}
          .section-heading h2{font-size:29px!important}
          .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:24px 11px!important}
          .product-card__visual{border-radius:18px!important}
          .product-card__body{padding-top:9px!important}
          .product-card h3{font-size:14.5px!important;margin-bottom:5px!important}
          .product-card p{display:none!important}
          .price strong{font-size:16px!important}
          .price s{font-size:10px!important}
          .client-plus{width:35px!important;height:35px!important}
          .client-counter{grid-template-columns:30px 27px 30px!important}
          .client-counter button{width:30px!important;height:35px!important}
          .client-choose{padding:9px 10px!important;font-size:11px!important}
          .product-card.client-accent{padding:7px!important;border-radius:18px!important}
        }
        @media(max-width:350px){
          .header-phone-number{font-size:10px!important}
          .client-promo{grid-template-columns:minmax(0,1fr) 98px}
          .client-promo h1{font-size:27px}
          .client-promo p{font-size:10px}
        }
      `;
      d.head.appendChild(css);

      var quick=d.querySelector('.quick-menu');
      if(quick) quick.style.display='none';
      var nav=d.querySelector('.category-nav');
      if(nav&&!d.querySelector('.client-promo-wrap')){
        var wrap=d.createElement('section');
        wrap.className='client-promo-wrap';
        wrap.innerHTML='<div class="client-promo" id="clientPromo"><div class="client-promo__copy"><span class="client-promo__eyebrow">Rolls Bar</span><h1>Акции</h1><p>Скидки, комбо и специальные предложения — всё выгодное в одном месте.</p><span class="client-promo__cta">Смотреть предложения <b>→</b></span></div><div class="client-promo__art"><span class="client-promo__food"></span></div></div>';
        nav.insertAdjacentElement('afterend',wrap);
        var promo=wrap.querySelector('#clientPromo');
        promo.addEventListener('click',function(){
          var target=d.getElementById('hits')||d.getElementById('sets');
          if(target) target.scrollIntoView({behavior:'smooth'});
        });
      }
      return true;
    }

    function bind(){
      var wrapper=stage.contentDocument;
      var inner=wrapper&&wrapper.getElementById('site');
      if(inner){
        inner.addEventListener('load',function(){setTimeout(applyDesign,120);});
        setTimeout(applyDesign,250);
        setTimeout(applyDesign,800);
      }
    }
    stage.addEventListener('load',bind);
    setTimeout(bind,1000);
  })();
  </script>
</body>
</html>
