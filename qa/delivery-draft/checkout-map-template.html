<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карта зон доставки Rolls Bar</title><!--LEAFLET_LICENSE--><style>/*LEAFLET_CSS*/</style><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:12px/1.3 system-ui,sans-serif;color:#292929}#map{height:100%;background:#eeeae0}.legend{position:absolute;z-index:500;left:8px;bottom:23px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}.legend span{background:#fffffff0;padding:4px 6px;border-radius:5px;box-shadow:0 1px 5px #0001;white-space:nowrap}.legend i{width:7px;height:7px;display:inline-block;border-radius:50%;margin-right:3px}.leaflet-bar a{width:38px!important;height:38px!important;line-height:38px!important}.origin{background:#fff;color:#292929;border:0;font-weight:700;border-radius:5px}.leaflet-popup-content{font:13px/1.4 system-ui,sans-serif}.leaflet-control-attribution{font-size:9px}.leaflet-container:focus-visible{outline:3px solid #df2929;outline-offset:-3px}
</style></head><body><div id="map" role="region" aria-label="Карта зон бесплатной доставки"></div><div class="legend" aria-label="Минимальный заказ для бесплатной доставки"></div><script>/*LEAFLET_JS*/</script><script>
'use strict';const ZONES=/*ZONE_DATA*/,ROADS=/*ROAD_DATA*/;const COLORS={1200:'#2f7d61',1500:'#2c80ad',2000:'#7f60b2',2500:'#ba799b',3000:'#c88430',3500:'#ae503e',4000:'#675940'};
const map=L.map('map',{scrollWheelZoom:false,dragging:!L.Browser.mobile,tapHold:false}).setView([44.953,34.115],11);map.zoomControl.setPosition('topright');map.zoomControl._zoomInButton.setAttribute('aria-label','Приблизить карту');map.zoomControl._zoomOutButton.setAttribute('aria-label','Отдалить карту');
L.geoJSON(ROADS,{interactive:false,style:{color:'#bbb6ab',weight:1,opacity:.55}}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);
L.geoJSON(ZONES,{style:f=>({color:COLORS[f.properties.minimum],weight:1.2,fillOpacity:.18,dashArray:'4 3'}),onEachFeature:(f,l)=>{l.bindTooltip('Бесплатная доставка от '+f.properties.minimum+' ₽');l.bindPopup('Минимальный заказ для бесплатной доставки: '+f.properties.minimum+' ₽.<br>Точные условия подтвердит менеджер.')}}).addTo(map);
L.circleMarker([44.973541,34.099398],{radius:6,color:'#fff',weight:2,fillColor:'#252525',fillOpacity:1}).bindTooltip('Rolls Bar',{permanent:true,direction:'top',className:'origin'}).addTo(map);
let customer=null;window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='rollsbar-map-address')return;const d=event.data;if(customer){map.removeLayer(customer);customer=null}const exact=d.exact===true&&Number.isFinite(d.lat)&&Number.isFinite(d.lon)&&Math.abs(d.lat)<=90&&Math.abs(d.lon)<=180;if(exact){customer=L.circleMarker([d.lat,d.lon],{radius:8,color:'#fff',weight:3,fillColor:'#de2929',fillOpacity:1}).bindTooltip('Ваш адрес',{permanent:true,direction:'top'}).addTo(map);map.setView([d.lat,d.lon],14)}else map.setView([44.953,34.115],11);document.body.dataset.exact=exact?'1':'0';window.rollsbarMapState={exact,lat:exact?d.lat:null,lon:exact?d.lon:null};});
for(const [tier,color]of Object.entries(COLORS)){const item=document.createElement('span');item.innerHTML='<i style="background:'+color+'"></i>от '+tier+' ₽';document.querySelector('.legend').append(item)}window.rollsbarMapReady=true;parent.postMessage({type:'rollsbar-map-ready'},location.origin);
</script></body></html>
