name: RollsBar Live Browser Gate B

# Dispatch only after the exact release's verified deployed marker is observed.
on:
  workflow_dispatch:
    inputs:
      checkout_mode:
        description: Historical Gate B, candidate shadow, or deployed release acceptance
        type: choice
        required: true
        default: historical
        options:
          - historical
          - shadow
          - live
      expected_marker:
        description: Exact 40 lowercase hex release SHA (required for shadow/live; live must equal selected ref HEAD)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rollsbar-live-browser-gate-b
  cancel-in-progress: true

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate dispatch before credentials or browser acceptance
        env:
          DISPATCH_MODE: ${{ inputs.checkout_mode }}
          DISPATCH_MARKER: ${{ inputs.expected_marker }}
        run: python3 qa/checkout/release_gate.py
      - name: Install Playwright Python packages
        run: |
          python3 -m pip install --disable-pip-version-check --quiet playwright paramiko
      - name: Install Chromium
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/wordpress/checkout-visual-parity-2026-10-25' ]; then
            # The hosted Ubuntu runner already supplies Chromium runtime libraries
            # and Liberation fonts (verified in the successful baseline log).
            python3 -m playwright install chromium
          else
            python3 -m playwright install --with-deps chromium
          fi
      - name: Read deployed application marker before browser acceptance
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 qa/repair/s1_r3q_release_read.py
      - name: Run live desktop + mobile Gate B
        run: python3 wordpress/deploy/gate_b_browser.py
      - name: Preview checkout candidate through browser response interception
        if: env.CHECKOUT_MODE == 'shadow'
        run: |
          set -o pipefail
          mkdir -p qa/visual-results/checkout-parity
          python3 qa/checkout/shadow_preview.py 2>&1 | tee qa/visual-results/checkout-parity/shadow.log
      - name: Verify actual deployed checkout release
        if: env.CHECKOUT_MODE == 'live'
        run: |
          set -o pipefail
          mkdir -p qa/visual-results/checkout-live
          python3 qa/checkout/shadow_preview.py --live-deployed 2>&1 | tee qa/visual-results/checkout-live/live.log
      - name: Read deployed application marker after browser acceptance
        if: always() && env.ROLLSBAR_QA_EXPECTED_MARKER != ''
        env:
          ROLLSBAR_QA_VERIFY_HISTORICAL: '0'
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 qa/repair/s1_r3q_release_read.py
      - name: Upload checkout shadow evidence
        if: always() && env.CHECKOUT_MODE == 'shadow'
        uses: actions/upload-artifact@v4
        with:
          name: checkout-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/visual-results/checkout-parity/
          if-no-files-found: error
          retention-days: 14
      - name: Upload checkout live evidence
        if: always() && env.CHECKOUT_MODE == 'live'
        uses: actions/upload-artifact@v4
        with:
          name: checkout-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/visual-results/checkout-live/
          if-no-files-found: error
          retention-days: 14
