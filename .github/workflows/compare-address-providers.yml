name: Compare address providers

on:
  workflow_dispatch:
    inputs:
      addresses_json:
        description: 'Optional JSON array override. Leave empty to use the verified 25-address migration dataset.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  compare:
    name: Compare geocoders without enabling delivery
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout RollsBar migration branch
        uses: actions/checkout@v4
        with:
          ref: wordpress/migration-2026-10-01

      - name: Run provider comparison
        env:
          INPUT_ADDRESSES_JSON: ${{ inputs.addresses_json }}
          ROLLSBAR_YANDEX_GEOCODER_KEY: ${{ secrets.ROLLSBAR_YANDEX_GEOCODER_KEY }}
          ROLLSBAR_2GIS_API_KEY: ${{ secrets.ROLLSBAR_2GIS_API_KEY }}
          ROLLSBAR_DADATA_API_KEY: ${{ secrets.ROLLSBAR_DADATA_API_KEY }}
        run: |
          if [ -n "$INPUT_ADDRESSES_JSON" ]; then
            export ROLLSBAR_TEST_ADDRESSES_JSON="$INPUT_ADDRESSES_JSON"
          else
            export ROLLSBAR_TEST_ADDRESSES_JSON="$(cat wordpress/data/address-provider-test-addresses.json)"
          fi
          python3 wordpress/tools/compare_address_providers.py

      - name: Add report to workflow summary
        if: always() && hashFiles('address-provider-comparison.md') != ''
        run: cat address-provider-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison evidence
        if: always() && hashFiles('address-provider-comparison.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rollsbar-address-provider-comparison
          path: |
            address-provider-comparison.md
            address-provider-comparison.json
          if-no-files-found: error
          retention-days: 30
