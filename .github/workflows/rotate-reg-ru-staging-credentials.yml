name: Rotate REG.RU RollsBar Staging Credentials

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/rotate-reg-ru-staging-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rollsbar-rotate-reg-ru-staging-credentials
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosting secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Rotate staging-only generated credentials
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_CONFIRM_ROTATE_STAGING_CREDENTIALS: YES
        run: python3 wordpress/deploy/rotate_staging_credentials.py
