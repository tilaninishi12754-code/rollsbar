name: ISPmanager Browser Login Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rollsbar-ispmanager-browser-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"

      - name: Install Playwright
        run: |
          python3 -m pip install --disable-pip-version-check --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Probe browser login read-only
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/ispmanager_browser_probe.py
