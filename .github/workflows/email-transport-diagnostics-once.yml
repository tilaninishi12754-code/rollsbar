name: Email Transport Diagnostics Once

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/email-transport-diagnostics-once.yml

permissions:
  contents: read

jobs:
  diagnose-email-transport:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging access
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"

      - name: Read-only staging mail diagnostics
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet paramiko
          python3 - <<'PY'
          import os
          import shlex
          from urllib.parse import urlsplit
          import paramiko

          base = os.environ['ISP_MANAGER_URL'].strip()
          user = os.environ['ISP_MANAGER_USER'].strip()
          password = os.environ['ISP_MANAGER_PASSWORD'].strip()
          host = urlsplit(base).hostname or ''
          if not host:
              raise SystemExit('Could not derive staging host')

          php = r'''<?php
          if ( 'staging' !== wp_get_environment_type() ) {
              fwrite(STDERR, "not_staging\n");
              exit(2);
          }

          function rb_diag_value($label, $value) {
              if (is_bool($value)) { $value = $value ? 'yes' : 'no'; }
              if ($value === null || $value === '') { $value = '(empty)'; }
              echo $label . '=' . $value . "\n";
          }

          rb_diag_value('wp_environment', wp_get_environment_type());
          rb_diag_value('site_url', home_url('/'));
          rb_diag_value('admin_email', get_option('admin_email'));
          rb_diag_value('woocommerce_email_from_name', get_option('woocommerce_email_from_name'));
          rb_diag_value('woocommerce_email_from_address', get_option('woocommerce_email_from_address'));
          $new_order = get_option('woocommerce_new_order_settings', array());
          rb_diag_value('new_order_enabled', is_array($new_order) ? ($new_order['enabled'] ?? '(default)') : '(invalid)');
          rb_diag_value('new_order_recipient', is_array($new_order) ? ($new_order['recipient'] ?? '(default)') : '(invalid)');
          rb_diag_value('php_sendmail_path', ini_get('sendmail_path'));
          rb_diag_value('php_SMTP', ini_get('SMTP'));
          rb_diag_value('php_smtp_port', ini_get('smtp_port'));

          $mail_plugins = array();
          foreach ((array) get_option('active_plugins', array()) as $plugin) {
              if (preg_match('/smtp|mail|ses|sendgrid|postmark|mailgun|brevo|wp-mail/i', $plugin)) {
                  $mail_plugins[] = $plugin;
              }
          }
          rb_diag_value('mail_related_active_plugins', empty($mail_plugins) ? '(none)' : implode(',', $mail_plugins));

          add_action('phpmailer_init', function($phpmailer) {
              rb_diag_value('phpmailer_Mailer', $phpmailer->Mailer ?? '(unknown)');
              rb_diag_value('phpmailer_Host', $phpmailer->Host ?? '(empty)');
              rb_diag_value('phpmailer_Port', $phpmailer->Port ?? '(empty)');
              rb_diag_value('phpmailer_SMTPAuth', $phpmailer->SMTPAuth ?? false);
              rb_diag_value('phpmailer_SMTPSecure', $phpmailer->SMTPSecure ?? '(empty)');
              rb_diag_value('phpmailer_From', $phpmailer->From ?? '(empty)');
              rb_diag_value('phpmailer_FromName', $phpmailer->FromName ?? '(empty)');
              rb_diag_value('phpmailer_Sender', $phpmailer->Sender ?? '(empty)');
              throw new Exception('ROLLSBAR_DIAGNOSTIC_STOP_BEFORE_SEND');
          }, 9999, 1);

          try {
              wp_mail('nobody@example.invalid', 'RollsBar diagnostics only', 'No message should be sent.');
          } catch (Throwable $e) {
              rb_diag_value('diagnostic_stop', strpos($e->getMessage(), 'ROLLSBAR_DIAGNOSTIC_STOP_BEFORE_SEND') !== false ? 'pass' : 'unexpected_exception');
          }
          ?>'''

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(
              hostname=host,
              port=22,
              username=user,
              password=password,
              timeout=15,
              auth_timeout=15,
              banner_timeout=15,
              look_for_keys=False,
              allow_agent=False,
          )

          remote = '.rollsbar-email-transport-diag.php'
          try:
              sftp = client.open_sftp()
              try:
                  with sftp.open(remote, 'w') as fh:
                      fh.write(php.encode('utf-8'))
                  sftp.chmod(remote, 0o600)
              finally:
                  sftp.close()

              command = (
                  'export PATH="$HOME/.local/bin:$PATH"; '
                  'echo "=== WORDPRESS / PHP ==="; '
                  'wp --path="$HOME/www/staging.rollsbar.ru" eval-file "$HOME/' + remote + '"; '
                  'echo "=== LOCAL MTA ==="; '
                  'echo -n "sendmail_cmd="; (command -v sendmail || true); '
                  'echo -n "sendmail_realpath="; (readlink -f "$(command -v sendmail)" 2>/dev/null || true); '
                  'echo -n "postfix_cmd="; (command -v postfix || true); '
                  'echo -n "exim_cmd="; (command -v exim || command -v exim4 || true); '
                  'echo "mta_processes:"; (ps -ef | grep -E "[p]ostfix|[e]xim|[s]endmail" | sed -E "s/[[:space:]]+/ /g" | head -n 20 || true); '
                  'echo "=== HOST IDENTITY ==="; '
                  'hostname -f 2>/dev/null || hostname; '
                  'echo -n "php_version="; php -r "echo PHP_VERSION;"; echo; '
                  'echo -n "server_ip="; (hostname -I 2>/dev/null | awk "{print \\$1}" || true)'
              )
              _, stdout, stderr = client.exec_command('bash -lc ' + shlex.quote(command), timeout=240)
              out = stdout.read().decode('utf-8', errors='replace').strip()
              err = stderr.read().decode('utf-8', errors='replace').strip()
              code = stdout.channel.recv_exit_status()
              print(out)
              if code != 0:
                  safe = ' | '.join(
                      line for line in err.splitlines()
                      if not any(word in line.lower() for word in ('password', 'secret', 'token'))
                  )[-2000:]
                  if safe:
                      print('diag_stderr=' + safe)
                  raise SystemExit(code)
          finally:
              try:
                  sftp = client.open_sftp()
                  try:
                      sftp.remove(remote)
                  except FileNotFoundError:
                      pass
                  finally:
                      sftp.close()
              except Exception:
                  pass
              client.close()
          PY

      - name: Public DNS mail policy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils >/dev/null
          fi
          echo "=== DNS ==="
          echo "rollsbar.ru MX:"
          dig +short MX rollsbar.ru || true
          echo "rollsbar.ru TXT:"
          dig +short TXT rollsbar.ru || true
          echo "_dmarc.rollsbar.ru TXT:"
          dig +short TXT _dmarc.rollsbar.ru || true
          echo "staging.rollsbar.ru A:"
          dig +short A staging.rollsbar.ru || true
