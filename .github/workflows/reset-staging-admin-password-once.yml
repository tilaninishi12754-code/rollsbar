name: Reset Staging Admin Password Once

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/reset-staging-admin-password-once.yml

permissions:
  contents: read

jobs:
  reset-staging-admin:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 5
    steps:
      - name: Validate staging hosting access
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"

      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko

      - name: Reset only the staging WordPress admin password
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          import shlex
          import socket
          from urllib.parse import urlsplit

          import paramiko

          base = os.environ['ISP_MANAGER_URL'].strip()
          user = os.environ['ISP_MANAGER_USER'].strip()
          password = os.environ['ISP_MANAGER_PASSWORD'].strip()
          host = urlsplit(base).hostname or ''
          if not host:
              raise SystemExit('Could not derive staging host')

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(
              hostname=host,
              port=22,
              username=user,
              password=password,
              timeout=15,
              auth_timeout=15,
              banner_timeout=15,
              look_for_keys=False,
              allow_agent=False,
          )

          remote_path = '.rollsbar-reset-staging-admin-once.py'
          remote_code = r'''#!/usr/bin/env python3
          import json
          import os
          import secrets
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          home = Path.home()
          wp_path = home / 'www' / 'staging.rollsbar.ru'
          secrets_path = home / '.rollsbar-staging-secrets.json'
          once_path = home / '.rollsbar-staging-admin-password-once.txt'
          username = 'rollsbar_staging_admin'
          expected_home = 'https://staging.rollsbar.ru'
          wp_bin = str(home / '.local' / 'bin' / 'wp')
          if not Path(wp_bin).exists():
              wp_bin = 'wp'

          def run_wp(*args, env=None, capture=True):
              proc = subprocess.run(
                  [wp_bin, f'--path={wp_path}', *args],
                  env=env,
                  check=False,
                  stdout=subprocess.PIPE if capture else subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if proc.returncode != 0:
                  raise RuntimeError('WP-CLI command failed')
              return (proc.stdout or '').strip()

          if not (wp_path / 'wp-load.php').exists():
              raise SystemExit('Refusing reset: staging WordPress not found')
          if run_wp('option', 'get', 'home') != expected_home:
              raise SystemExit('Refusing reset: target is not staging.rollsbar.ru')
          run_wp('user', 'get', username, '--field=ID')

          data = json.loads(secrets_path.read_text(encoding='utf-8'))
          old_password = str(data.get('wp_admin_password') or '')
          if not old_password:
              raise SystemExit('Refusing reset: stored staging admin password is missing')

          new_password = secrets.token_urlsafe(24)
          env = os.environ.copy()
          env['ROLLSBAR_NEW_ADMIN_PASSWORD'] = new_password
          php_set = (
              '$u=get_user_by("login","rollsbar_staging_admin");'
              'if(!$u){fwrite(STDERR,"missing user\\n");exit(1);}'
              'wp_set_password(getenv("ROLLSBAR_NEW_ADMIN_PASSWORD"),$u->ID);'
          )

          changed = False
          try:
              run_wp('eval', php_set, env=env)
              changed = True
              php_check = (
                  '$u=get_user_by("login","rollsbar_staging_admin");'
                  'if(!$u || !wp_check_password(getenv("ROLLSBAR_NEW_ADMIN_PASSWORD"),$u->user_pass,$u->ID)){exit(1);}'
              )
              run_wp('eval', php_check, env=env)

              updated = dict(data)
              updated['wp_admin_password'] = new_password
              tmp_path = secrets_path.with_suffix('.json.tmp')
              tmp_path.write_text(json.dumps(updated, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              os.chmod(tmp_path, 0o600)
              os.replace(tmp_path, secrets_path)
              os.chmod(secrets_path, 0o600)

              once_path.write_text(
                  'URL: https://staging.rollsbar.ru/wp-admin/\n'
                  'Login: rollsbar_staging_admin\n'
                  f'Password: {new_password}\n',
                  encoding='utf-8',
              )
              os.chmod(once_path, 0o600)
          except Exception:
              if changed:
                  rollback_env = os.environ.copy()
                  rollback_env['ROLLSBAR_NEW_ADMIN_PASSWORD'] = old_password
                  try:
                      run_wp('eval', php_set, env=rollback_env)
                  except Exception:
                      pass
              raise
          finally:
              env.pop('ROLLSBAR_NEW_ADMIN_PASSWORD', None)

          print('STAGING ADMIN PASSWORD RESET PASS')
          print('target=staging.rollsbar.ru')
          print('user=rollsbar_staging_admin')
          print('one_time_file=$HOME/.rollsbar-staging-admin-password-once.txt')
          print('production_touched=no')
          '''

          sftp = client.open_sftp()
          try:
              with sftp.open(remote_path, 'w') as fh:
                  fh.write(remote_code.encode('utf-8'))
              sftp.chmod(remote_path, 0o700)
          finally:
              sftp.close()

          try:
              command = 'python3 ' + shlex.quote('$HOME/' + remote_path)
              # Expand $HOME safely in the remote shell rather than logging any secret.
              command = 'python3 "$HOME/' + remote_path + '"'
              _, stdout, stderr = client.exec_command('bash -lc ' + shlex.quote(command), timeout=180)
              out = stdout.read().decode('utf-8', errors='replace')
              err = stderr.read().decode('utf-8', errors='replace')
              code = stdout.channel.recv_exit_status()
              if out:
                  print(out, end='' if out.endswith('\n') else '\n')
              if code != 0:
                  if err:
                      print('reset_stderr=' + ' | '.join(err.splitlines()[-5:])[:800])
                  raise SystemExit(code)
          finally:
              try:
                  sftp = client.open_sftp()
                  try:
                      sftp.remove(remote_path)
                  finally:
                      sftp.close()
              except Exception:
                  pass
              client.close()
          PY
