name: REG.RU SSH Shell Probe

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/hosting-shell-probe.yml
      - wordpress/deploy/hosting_shell_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rollsbar-hosting-shell-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Install SSH probe dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Probe SSH shell read-only capabilities
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/hosting_shell_probe.py
