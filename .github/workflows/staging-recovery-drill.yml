name: Staging Recovery Drill

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/staging-recovery-drill.yml

permissions:
  contents: read

concurrency:
  group: rollsbar-staging-recovery-drill
  cancel-in-progress: false

jobs:
  recovery-cleanup:
    # One-shot safety path: only an explicitly marked commit can mutate drill resources.
    if: contains(github.event.head_commit.message, '[recovery-cleanup]')
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosting access secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Remove only orphaned rbdrill databases
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_CONFIRM_RECOVERY_ORPHAN_CLEANUP: YES
        run: python3 wordpress/deploy/cleanup_recovery_drill_orphans.py
