name: Staging Recovery Drill

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/staging-recovery-drill.yml

permissions:
  contents: read

concurrency:
  group: rollsbar-staging-recovery-drill
  cancel-in-progress: false

jobs:
  recovery-drill:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[recovery-drill]')
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosting access secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Restore latest snapshot into isolated temporary database
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_CONFIRM_RECOVERY_DRILL: YES
        run: python3 wordpress/deploy/recovery_drill.py
