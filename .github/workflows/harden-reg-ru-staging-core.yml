name: Harden REG.RU Staging Core

on:
  workflow_dispatch:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - wordpress/deploy/harden_staging_core.py
      - .github/workflows/harden-reg-ru-staging-core.yml

permissions:
  contents: read

concurrency:
  group: rollsbar-harden-reg-ru-staging-core
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosting access secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Backup, repair same-version core, and harden wp-config permissions
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_CONFIRM_STAGING_HARDENING: YES
        run: python3 wordpress/deploy/harden_staging_core.py
