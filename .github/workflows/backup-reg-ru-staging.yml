name: Backup REG.RU Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rollsbar-production-cutover
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Authorized pre-cutover inventory and backup
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          PRECUTOVER_MODE: backup
        run: python3 wordpress/deploy/cutover_www_tls.py
