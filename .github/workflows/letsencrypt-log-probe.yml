name: ISPmanager Let's Encrypt Log Probe

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/letsencrypt-log-probe.yml
      - wordpress/deploy/letsencrypt_log_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosting secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Read Let's Encrypt logs
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/letsencrypt_log_probe.py
