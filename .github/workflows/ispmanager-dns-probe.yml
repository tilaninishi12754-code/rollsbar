name: ISPmanager DNS Probe

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/ispmanager-dns-probe.yml
      - wordpress/deploy/ispmanager_dns_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe ISPmanager DNS zones read-only
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/ispmanager_dns_probe.py
