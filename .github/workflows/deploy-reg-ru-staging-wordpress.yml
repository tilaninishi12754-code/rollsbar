name: Deploy REG.RU RollsBar Staging WordPress

# Retry-safe live deploy; current staging is already promoted to 118 products.
on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/deploy-reg-ru-staging-wordpress.yml
      - wordpress/deploy/backup-staging.sh
      - wordpress/deploy/bootstrap-staging.sh
      - wordpress/deploy/deploy_staging_wordpress.py
      - wordpress/deploy/provision_staging_seo.py
      - wordpress/deploy/harden_staging_http.py
      - wordpress/deploy/mark_staging_deployed_sha.py
      - wordpress/deploy/provision-legal-pages.php
      - wordpress/deploy/verify-staging-address-suggestions.php
      - wordpress/deploy/verify-staging-legal-pages.php
      - wordpress/deploy/verify-staging-notifications.php
      - wordpress/deploy/verify-staging-payment-readiness.php
      - wordpress/deploy/verify-staging-reviews.php
      - wordpress/wp-content/themes/rollsbar-theme/**
      - wordpress/wp-content/plugins/rollsbar-core/**
      - wordpress/data/catalog.json
      - wordpress/data/product-media/**
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed staging operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - catalog-maintenance
          - release-inspect
          - release-resume
          - client-media
          - storefront-ux
          - storefront-ux-controls
          - interaction-stability
          - checkout-direct-port
          - controls-no-dock
          - delivery-rules
      release_sha:
        description: Exact already deployed application SHA (required for release-resume)
        required: false
        type: string

      direct_port_phase:
        description: Checkout Direct Port phase
        type: choice
        default: apply
        options: [apply, inspect, finalize, probe-mail, enable-mail, verify-mail]
      test_order_id:
        description: Single owner-authorized staging test order to inspect (never create)
        type: string
        default: ''
      proof_run_id:
        description: Successful Direct Port apply run ID (finalize only)
        type: string
        default: ''
      reviewed_manifest:
        description: SHA256 of screenshot set actually inspected (finalize only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rollsbar-deploy-reg-ru-staging-wordpress
  cancel-in-progress: false

jobs:
  storefront-ux:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'storefront-ux' || inputs.operation == 'storefront-ux-controls' || inputs.operation == 'interaction-stability' || inputs.operation == 'controls-no-dock') && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify storefront contracts before staging access
        if: inputs.operation == 'storefront-ux' || inputs.operation == 'interaction-stability'
        run: |
          php qa/visual/cart-response-contract.php "$PWD"
          php qa/visual/storefront-ux-contract.php "$PWD"
          php qa/visual/b12-contract.php "$PWD"
          php qa/visual/client-media-contract.php
          php -l wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-cart-actions.php
          php -l wordpress/wp-content/themes/rollsbar-theme/front-page.php
          php -l wordpress/wp-content/themes/rollsbar-theme/footer.php
          node --check wordpress/wp-content/themes/rollsbar-theme/assets/js/app.js
          python3 wordpress/deploy/test_storefront_ux_release.py
      - name: Install staging transport and locked browser
        run: |
          python3 -m pip install --disable-pip-version-check --quiet paramiko
          npm --prefix qa install --no-save --ignore-scripts --package-lock=false @playwright/test@1.64.1
          node qa/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Fresh verified backup and scoped storefront deploy
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: python3 wordpress/deploy/apply_storefront_ux_staging.py --phase apply ${{ inputs.operation == 'controls-no-dock' && '--no-dock' || inputs.operation == 'storefront-ux-controls' && '--controls-only' || inputs.operation == 'interaction-stability' && '--interaction-stability' || '' }}
      - name: Real Woo storefront browser acceptance without orders
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: node qa/visual/${{ inputs.operation == 'controls-no-dock' && 'controls-no-dock.mjs' || inputs.operation == 'storefront-ux-controls' && 'storefront-controls.mjs' || 'storefront-ux.mjs' }}
      - name: Repeated interaction and pointer hit-target acceptance
        if: inputs.operation == 'interaction-stability'
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: node qa/visual/interaction-stability.mjs
      - name: Finalize exact release marker after browser PASS
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: python3 wordpress/deploy/apply_storefront_ux_staging.py --phase finalize ${{ inputs.operation == 'controls-no-dock' && '--no-dock' || inputs.operation == 'storefront-ux-controls' && '--controls-only' || inputs.operation == 'interaction-stability' && '--interaction-stability' || '' }}
      - name: Read actual state on failure without mutation retry
        if: failure()
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: python3 wordpress/deploy/apply_storefront_ux_staging.py --phase inspect ${{ inputs.operation == 'controls-no-dock' && '--no-dock' || inputs.operation == 'storefront-ux-controls' && '--controls-only' || inputs.operation == 'interaction-stability' && '--interaction-stability' || '' }}
      - name: Upload storefront release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-ux-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/visual-results/storefront-ux-staging/
          if-no-files-found: error
          retention-days: 30

  client-media:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'client-media' && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline media contracts before staging access
        run: |
          php qa/visual/client-media-contract.php
          python3 wordpress/tools/test_client_media_sources.py
          python3 wordpress/deploy/test_client_media_release.py
          bash -n wordpress/deploy/bootstrap-staging.sh
          php -l wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-client-media.php
      - name: Install staging transport and browser
        run: |
          python3 -m pip install --disable-pip-version-check --quiet paramiko playwright
          python3 -m playwright install chromium
      - name: Backup, deploy media only, sync twice and audit catalog
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir -p qa/visual-results/client-media
          python3 wordpress/deploy/apply_client_media_staging.py --phase apply 2>&1 | tee qa/visual-results/client-media/release.log
      - name: Verify real desktop and mobile client photos
        run: python3 wordpress/deploy/client_media_browser.py
      - name: Record verified release after browser acceptance
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: python3 wordpress/deploy/apply_client_media_staging.py --phase finalize
      - name: Inspect actual state after a failure without retrying mutation
        if: failure()
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: python3 wordpress/deploy/apply_client_media_staging.py --phase inspect
      - name: Upload client media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/visual-results/client-media/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DADATA_API_KEY: ${{ secrets.ROLLSBAR_DADATA_API_KEY }}
          ROLLSBAR_TELEGRAM_BOT_TOKEN: ${{ secrets.ROLLSBAR_TELEGRAM_BOT_TOKEN }}
          ROLLSBAR_TELEGRAM_CHAT_ID: ${{ secrets.ROLLSBAR_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          test -n "$ROLLSBAR_DADATA_API_KEY"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ROLLSBAR_DADATA_API_KEY"
          if [[ -n "$ROLLSBAR_TELEGRAM_BOT_TOKEN" || -n "$ROLLSBAR_TELEGRAM_CHAT_ID" ]]; then
            test -n "$ROLLSBAR_TELEGRAM_BOT_TOKEN"
            test -n "$ROLLSBAR_TELEGRAM_CHAT_ID"
            echo "::add-mask::$ROLLSBAR_TELEGRAM_BOT_TOKEN"
            echo "::add-mask::$ROLLSBAR_TELEGRAM_CHAT_ID"
          fi
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Deploy WordPress staging while preserving promoted catalog
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DADATA_API_KEY: ${{ secrets.ROLLSBAR_DADATA_API_KEY }}
          ROLLSBAR_TELEGRAM_BOT_TOKEN: ${{ secrets.ROLLSBAR_TELEGRAM_BOT_TOKEN }}
          ROLLSBAR_TELEGRAM_CHAT_ID: ${{ secrets.ROLLSBAR_TELEGRAM_CHAT_ID }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
          ROLLSBAR_CONFIRM_BOOTSTRAP_STAGING: YES
        run: python3 wordpress/deploy/deploy_staging_wordpress.py
      - name: Ensure pinned staging SEO owner
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
          ROLLSBAR_CONFIRM_STAGING_SEO: YES
          ROLLSBAR_SEO_BACKUP_ALREADY_VERIFIED: YES
        run: python3 wordpress/deploy/provision_staging_seo.py
      - name: Enforce HTTP redirect and safe response headers
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_CONFIRM_HTTP_HARDENING: YES
        run: python3 wordpress/deploy/harden_staging_http.py
      - name: Audit live SEO ownership
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/audit_staging_seo.py
      - name: Persist verified deployed SHA marker
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
        run: python3 wordpress/deploy/mark_staging_deployed_sha.py

  catalog-maintenance:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'catalog-maintenance' && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging hosting secrets
        shell: bash
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Run guarded staging catalog maintenance
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/maintain_staging_catalog.py

  release-inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-inspect' && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Inspect failed staging release and remove safe stale runtime only
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p qa/visual-results/ssh-release-recovery
          python3 wordpress/deploy/inspect_staging_release.py 2>&1 | tee qa/visual-results/ssh-release-recovery/inspection.log
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/visual-results/ssh-release-recovery/
          if-no-files-found: error
          retention-days: 14

  release-resume:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-resume' && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release input and staging hosting secrets
        shell: bash
        env:
          ROLLSBAR_RELEASE_SHA: ${{ inputs.release_sha }}
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: |
          python3 -c 'import sys; sys.path.insert(0,"wordpress/deploy"); import os; from resume_staging_release import validate_input; validate_input(os.environ["ROLLSBAR_RELEASE_SHA"],os.environ["GITHUB_REF_NAME"])'
          test -n "$ISP_MANAGER_URL"
          test -n "$ISP_MANAGER_USER"
          test -n "$ISP_MANAGER_PASSWORD"
          echo "::add-mask::$ISP_MANAGER_USER"
          echo "::add-mask::$ISP_MANAGER_PASSWORD"
      - name: Install SSH dependency
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Verify partial state, provision SEO, harden HTTP, audit, mark application SHA, read back
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_RELEASE_SHA: ${{ inputs.release_sha }}
        run: python3 wordpress/deploy/resume_staging_release.py

  checkout-direct:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'checkout-direct-port' && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 30
    env:
      ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
      DIRECT_PORT_PHASE: ${{ inputs.direct_port_phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scope and syntax before credentials
        run: |
          python3 -c "import sys;sys.path.insert(0,'wordpress/deploy');from apply_checkout_direct_staging import scope;scope()"
          php -l wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-checkout.php
          php -l wordpress/deploy/verify-checkout-direct-port.php
          node --check wordpress/wp-content/plugins/rollsbar-core/assets/js/checkout.js
      - name: Install transport
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Install browser gates
        if: inputs.direct_port_phase == 'apply'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet playwright Pillow
          npm --prefix qa install --no-save --ignore-scripts --package-lock=false @playwright/test@1.64.1
          node qa/node_modules/@playwright/test/cli.js install --with-deps chromium
          python3 -m playwright install chromium
      - name: Validate finalized proof run
        if: inputs.direct_port_phase == 'finalize'
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN: ${{ inputs.proof_run_id }}
        run: |
          [[ "$PROOF_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > /tmp/direct-run.json
          python3 -c "import json,os;d=json.load(open('/tmp/direct-run.json'));assert d['head_sha']==os.environ['GITHUB_SHA'] and d['conclusion']=='success' and d['name']=='Deploy REG.RU RollsBar Staging WordPress'"
      - uses: actions/download-artifact@v4
        if: inputs.direct_port_phase == 'finalize'
        with:
          name: checkout-direct-${{ inputs.proof_run_id }}
          path: qa/visual-results
          run-id: ${{ inputs.proof_run_id }}
          github-token: ${{ github.token }}
      - name: Fresh verified backup and narrow deploy / inspected finalization
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest }}
        run: python3 wordpress/deploy/apply_checkout_direct_staging.py --phase "$DIRECT_PORT_PHASE"
      - name: Live native modal, field, COD and DaData gate (no order submission)
        if: inputs.direct_port_phase == 'apply'
        run: python3 qa/checkout/direct_port.py --live
      - name: Storefront original regression
        if: inputs.direct_port_phase == 'apply'
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
        run: node --import ./qa/visual/staging-browser-diagnostics.mjs qa/visual/storefront-ux.mjs
      - name: Storefront Interaction Stability regression
        if: inputs.direct_port_phase == 'apply'
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
        run: node --import ./qa/visual/staging-browser-diagnostics.mjs qa/visual/interaction-stability.mjs
      - name: Screenshot manifest for subsequent vision review
        if: inputs.direct_port_phase == 'apply'
        run: python3 wordpress/deploy/apply_checkout_direct_staging.py --phase manifest > qa/visual-results/checkout-direct/screenshot-manifest.txt
      - name: Inspect actual state after failure (no mutation retry)
        if: failure()
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/apply_checkout_direct_staging.py --phase inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-direct-${{ github.run_id }}
          path: |
            qa/visual-results/checkout-direct/
            qa/visual-results/storefront-ux-staging/
          retention-days: 30

  delivery-rules:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'delivery-rules' && github.ref_name == 'wordpress/checkout-visual-parity-2026-10-25'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 30
    env:
      ROLLSBAR_DEPLOY_SHA: ${{ github.sha }}
      DIRECT_PORT_PHASE: ${{ inputs.direct_port_phase }}
      ROLLSBAR_MAIL_TEST_ORDER_ID: ${{ inputs.test_order_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scope and syntax before credentials
        run: |
          python3 -c "import sys;sys.path.insert(0,'wordpress/deploy');from apply_delivery_rules_staging import scope;scope()"
          php -l wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-checkout.php
          php -l wordpress/deploy/verify-delivery-rules.php
          node --check wordpress/wp-content/plugins/rollsbar-core/assets/js/checkout.js
          php qa/checkout/geography_fixture.php
      - name: Install transport
        run: python3 -m pip install --disable-pip-version-check --quiet paramiko
      - name: Install browser gates
        if: inputs.direct_port_phase == 'apply'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet playwright Pillow
          npm --prefix qa install --no-save --ignore-scripts --package-lock=false @playwright/test@1.64.1
          node qa/node_modules/@playwright/test/cli.js install --with-deps chromium
          python3 -m playwright install chromium
      - name: Validate finalized proof run
        if: inputs.direct_port_phase == 'finalize'
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN: ${{ inputs.proof_run_id }}
        run: |
          [[ "$PROOF_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > /tmp/direct-run.json
          python3 -c "import json,os;d=json.load(open('/tmp/direct-run.json'));assert d['head_sha']==os.environ['GITHUB_SHA'] and d['conclusion']=='success' and d['name']=='Deploy REG.RU RollsBar Staging WordPress'"
      - uses: actions/download-artifact@v4
        if: inputs.direct_port_phase == 'finalize'
        with:
          name: delivery-rules-${{ inputs.proof_run_id }}
          path: qa/visual-results
          run-id: ${{ inputs.proof_run_id }}
          github-token: ${{ github.token }}
      - name: Fresh verified backup and narrow deploy / inspected finalization
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
          ROLLSBAR_REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest }}
        run: python3 wordpress/deploy/apply_delivery_rules_staging.py --phase "$DIRECT_PORT_PHASE"
      - name: Live native modal, field, COD and DaData gate (no order submission)
        if: inputs.direct_port_phase == 'apply'
        run: |
          # RB-021 is owner-deferred; its unaccepted alias gate is standalone.
          python3 qa/checkout/delivery_scenario.py --live
          python3 qa/checkout/checkout_policy_live.py
      - name: Live exact address tiers and fail-closed cases
        if: inputs.direct_port_phase == 'apply'
        run: python3 qa/checkout/delivery_address_probe.py
      - name: Live restored map and exact address point
        if: inputs.direct_port_phase == 'apply'
        run: python3 qa/checkout/delivery_map.py
      - name: Adversarial native pickup and close-reopen gate (no orders)
        if: inputs.direct_port_phase == 'apply'
        run: python3 qa/checkout/delivery_adversarial.py
      - name: Immutable modal chrome and unmasked source diffs
        if: inputs.direct_port_phase == 'apply'
        run: python3 qa/checkout/delivery_reference.py
      - name: Storefront original regression
        if: inputs.direct_port_phase == 'apply'
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
        run: node --import ./qa/visual/staging-browser-diagnostics.mjs qa/visual/storefront-ux.mjs
      - name: Preserve original storefront proof
        if: inputs.direct_port_phase == 'apply'
        run: cp qa/visual-results/storefront-ux-staging/browser.json qa/visual-results/storefront-ux-staging/original-browser.json
      - name: Storefront controls regression (accepted no-shelf contract)
        if: inputs.direct_port_phase == 'apply'
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
        run: node --import ./qa/visual/staging-browser-diagnostics.mjs qa/visual/controls-no-dock.mjs
      - name: Storefront Interaction Stability regression with accepted no-shelf contract
        if: inputs.direct_port_phase == 'apply'
        env:
          ROLLSBAR_UX_BASE: https://staging.rollsbar.ru
        run: node --import ./qa/visual/staging-browser-diagnostics.mjs qa/visual/interaction-stability.mjs
      - name: Screenshot manifest for subsequent vision review
        if: inputs.direct_port_phase == 'apply'
        run: python3 wordpress/deploy/apply_delivery_rules_staging.py --phase manifest > qa/visual-results/delivery-rules/screenshot-manifest.txt
      - name: Inspect actual state after failure (no mutation retry)
        if: failure()
        env:
          ISP_MANAGER_URL: ${{ secrets.ISP_MANAGER_URL }}
          ISP_MANAGER_USER: ${{ secrets.ISP_MANAGER_USER }}
          ISP_MANAGER_PASSWORD: ${{ secrets.ISP_MANAGER_PASSWORD }}
        run: python3 wordpress/deploy/apply_delivery_rules_staging.py --phase inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-rules-${{ github.run_id }}
          path: |
            qa/visual-results/delivery-rules/
            qa/visual-results/canonical-host/
            qa/visual-results/checkout-policy/
            qa/visual-results/delivery-reference/
            qa/visual-results/storefront-ux-staging/
          retention-days: 30
      - name: Upload lightweight screenshot review bundle (full traces retained above)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-review-${{ github.run_id }}
          path: |
            qa/visual-results/delivery-rules/**/*.png
            qa/visual-results/delivery-rules/**/*.json
            qa/visual-results/canonical-host/
            qa/visual-results/checkout-policy/
            qa/visual-results/delivery-rules/*.txt
            qa/visual-results/delivery-rules/*.log
            qa/visual-results/delivery-reference/
            qa/visual-results/storefront-ux-staging/**/*.png
            qa/visual-results/storefront-ux-staging/**/*.json
          retention-days: 30
