name: Test Staging Address Suggestions

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - .github/workflows/test-staging-address-suggestions.yml
      - wordpress/tools/test_staging_address_suggestions.py
      - wordpress/wp-content/plugins/rollsbar-core/**
      - wordpress/deploy/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait briefly for staging deploy
        run: sleep 90
      - name: Verify DaData checkout runtime
        run: python3 wordpress/tools/test_staging_address_suggestions.py
