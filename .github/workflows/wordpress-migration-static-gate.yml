name: WordPress Migration Static Gate

on:
  push:
    branches:
      - wordpress/migration-2026-10-01
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-migration-static-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Python syntax
        run: |
          python3 -m compileall -q wordpress/deploy wordpress/tools
          echo "Deployment/tool Python syntax PASS"

      - name: JavaScript syntax
        run: |
          node --check wordpress/wp-content/themes/rollsbar-theme/assets/js/app.js
          node --check wordpress/wp-content/plugins/rollsbar-core/assets/js/checkout.js

      - name: Checkout architecture guard
        run: |
          grep -q "woocommerce_register_additional_checkout_field" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-checkout.php
          if grep -Rni --include='*.php' "woocommerce_checkout_fields" wordpress/wp-content/plugins/rollsbar-core; then
            echo "Legacy checkout field API found in rollsbar-core"
            exit 1
          fi
          echo "Block-native checkout architecture PASS"

      - name: Order notification architecture guard
        run: |
          grep -q "woocommerce_order_status_changed" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-notifications.php
          grep -q "processing.*on-hold.*completed" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-notifications.php
          if grep -q "woocommerce_store_api_checkout_order_processed" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-notifications.php; then
            echo "Telegram must not notify before payment processing"
            exit 1
          fi
          grep -q "as_enqueue_async_action" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-notifications.php
          grep -q "rollsbar_telegram_include_personal_data" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-notifications.php
          grep -q "CheckoutFields::class" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-order-details.php

          if grep -Rni --include='*.php' "woocommerce_email_order_meta_fields" wordpress/wp-content/plugins/rollsbar-core; then
            echo "Duplicate custom email meta renderer found; WooCommerce core should own Additional Checkout Fields email rendering"
            exit 1
          fi

          if grep -RniE --include='*.php' "define\([[:space:]]*['\"]ROLLSBAR_TELEGRAM_(BOT_TOKEN|CHAT_ID)['\"][[:space:]]*,[[:space:]]*['\"][^'\"]+['\"]" wordpress; then
            echo "Hard-coded Telegram credential found"
            exit 1
          fi

          echo "Order notification architecture PASS"

      - name: Admin model compatibility guard
        run: |
          grep -q "_rollsbar_composition" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-product-fields.php
          grep -q "_rollsbar_weight_display" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-catalog-importer.php
          grep -q "manage_woocommerce_page_wc-orders_columns" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-order-details.php
          grep -q "manage_woocommerce_page_wc-orders_custom_column" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-order-details.php
          grep -q "custom_order_tables" wordpress/wp-content/plugins/rollsbar-core/rollsbar-core.php
          grep -q "cart_checkout_blocks" wordpress/wp-content/plugins/rollsbar-core/rollsbar-core.php
          grep -q "WC tested up to: 11.1.2" wordpress/wp-content/plugins/rollsbar-core/rollsbar-core.php
          echo "Admin model + Woo compatibility PASS"

      - name: Delivery rules architecture guard
        run: |
          grep -q "class RollsBar_Delivery_Rules" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-delivery-rules.php
          grep -q "'min_order' => 1200" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-delivery-rules.php
          grep -q "'min_order' => 4000" wordpress/wp-content/plugins/rollsbar-core/includes/class-rollsbar-delivery-rules.php
          grep -q "Бесплатная доставка от суммы по району" wordpress/wp-content/themes/rollsbar-theme/front-page.php
          grep -q "Ручного выбора зоны клиентом не будет" wordpress/wp-content/themes/rollsbar-theme/front-page.php
          echo "Delivery rules architecture PASS"

      - name: Deployment shell syntax
        run: |
          for script in wordpress/deploy/*.sh; do
            bash -n "$script"
          done
          echo "Deployment shell syntax PASS"

      - name: Catalog JSON + invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('wordpress/data/catalog.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          products=d['products']
          cards=len(products)
          rows=sum(len(x.get('variants') or []) or 1 for x in products)
          assert cards==118, f'cards={cards}, expected 118'
          assert rows==131, f'rows={rows}, expected 131'
          assert d.get('approved_source_commit')=='a5e524392abcf89ffd5ace2a18218a6b59ed3b61'
          print(f'Catalog PASS: {cards} cards / {rows} source rows')
          PY

      - name: No obvious secrets in tracked WordPress source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          patterns = [
              re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY'),
              re.compile(r'\bclient_secret\s*=\s*["\'](?!\$|<)[^"\']{6,}["\']', re.I),
              re.compile(r'\bapi[_-]?key\s*=\s*["\'](?!\$|<)[^"\']{8,}["\']', re.I),
              re.compile(r'\bpassword\s*=\s*["\'](?!\$|<)[^"\']{6,}["\']', re.I),
              re.compile(r'\bsk-[A-Za-z0-9]{20,}')
          ]

          findings=[]
          for p in Path('wordpress').rglob('*'):
              if not p.is_file() or p.suffix.lower() in {'.md', '.png', '.jpg', '.jpeg', '.webp', '.gif', '.zip'}:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for n,line in enumerate(text.splitlines(),1):
                  if any(rx.search(line) for rx in patterns):
                      findings.append(f'{p}:{n}:{line.strip()}')

          if findings:
              print('\n'.join(findings))
              print('Potential literal secret material found')
              sys.exit(1)

          print('Secret-pattern scan PASS (runtime $VARIABLE references allowed)')
          PY
